name: CD-PROD

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          sleep 10
          if [ -f FAIL ]; then
            echo "FAIL file present"
            exit 1
          fi

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: sleep 15

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Deploy (fake)
        run: sleep 15

  sync-gitops:
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - name: Sync gitops (fake)
        run: sleep 5
